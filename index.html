</style></head><body><div class="wrap">
<h1>♞&#xFE0E; Chessy</h1><p class="sub">Learn chess one idea at a time, then play it.</p>
<nav><button data-t="play" class="on">Play</button><button data-t="learn">Learn</button><button data-t="review">Review</button></nav>
<div id="bar"><b>Board</b><div class="sw" id="sw"></div>

<section id="play" class="two">

<label>You play<select id="me"><option value="w">White</option><option value="b">Black</option></select></label></div>

</section>

<p class="ft">Chessy · learn, play and improve at chess ♞</p>
</div>
<script>
const $=i=>document.getElementById(i),START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -';
const D=[[1,0],[-1,0],[0,1],[0,-1]],G=[[1,1],[1,-1],[-1,1],[-1,-1]],N=[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]],V={P:100,N:320,B:330,R:500,Q:900,K:0};
function fen(f){const[p,t,c]=f.split(' ');const b=[];for(const ch of p.replace(/\//g,''))if(+ch)for(let k=0;k<+ch;k++)b.push(null);else b.push((ch==ch.toUpperCase()?'w':'b')+ch.toUpperCase());return{b,turn:t||'w',cast:{wK:c.includes('K'),wQ:c.includes('Q'),bK:c.includes('k'),bQ:c.includes('q')},ep:-1}}
function att(s,sq,c){const b=s.b,o=c=='w'?'b':'w',r=sq>>3,f=sq&7;
 const at=(r2,f2,ts)=>{if(r2<0||r2>7||f2<0||f2>7)return 0;const q=b[r2*8+f2];return q&&q[0]==o&&ts.includes(q[1])};
 const pd=c=='w'?-1:1;if(at(r+pd,f-1,'P')||at(r+pd,f+1,'P'))return 1;
 for(const[a,e]of N)if(at(r+a,f+e,'N'))return 1;
 for(const[a,e]of[...D,...G])if(at(r+a,f+e,'K'))return 1;
 for(const[ds,ts]of[[D,'RQ'],[G,'BQ']])for(const[a,e]of ds){let k=1,r2,f2;while((r2=r+a*k)>=0&&r2<8&&(f2=f+e*k)>=0&&f2<8){const q=b[r2*8+f2];if(q){if(q[0]==o&&ts.includes(q[1]))return 1;break}k++}}
 return 0}
function pseudo(s,c){const m=[],b=s.b;for(let i=0;i<64;i++){const p=b[i];if(!p||p[0]!=c)continue;const r=i>>3,f=i&7,t=p[1];
 const add=(r2,f2)=>{if(r2<0||r2>7||f2<0||f2>7)return 0;const j=r2*8+f2,q=b[j];if(q&&q[0]==c)return 0;m.push({from:i,to:j});return q?0:1};
 if(t=='P'){const d=c=='w'?-1:1,st=c=='w'?6:1,pr=c=='w'?0:7;
  const push=(j,x)=>{if(j>>3==pr)for(const k of'QRBN')m.push({from:i,to:j,promo:k});else m.push({from:i,to:j,...x})};
  if(r+d>=0&&r+d<8){const j=(r+d)*8+f;if(!b[j]){push(j);if(r==st&&!b[j+d*8])m.push({from:i,to:j+d*8,dbl:1})}
   for(const df of[-1,1]){const f2=f+df;if(f2<0||f2>7)continue;const j2=(r+d)*8+f2,q=b[j2];if(q&&q[0]!=c)push(j2);else if(j2==s.ep)push(j2,{ep:1})}}
 }else if(t=='N')for(const[a,e]of N)add(r+a,f+e);
 else if(t=='K'){for(const[a,e]of[...D,...G])add(r+a,f+e);const w=c=='w'?7:0,h=w*8;
  if(i==h+4){if(s.cast[c+'K']&&!b[h+5]&&!b[h+6]&&b[h+7]==c+'R'&&!att(s,h+4,c)&&!att(s,h+5,c)&&!att(s,h+6,c))m.push({from:i,to:h+6,cs:'K'});
   if(s.cast[c+'Q']&&!b[h+3]&&!b[h+2]&&!b[h+1]&&b[h]==c+'R'&&!att(s,h+4,c)&&!att(s,h+3,c)&&!att(s,h+2,c))m.push({from:i,to:h+2,cs:'Q'})}
 }else{const ds=t=='R'?D:t=='B'?G:[...D,...G];for(const[a,e]of ds){let k=1;while(add(r+a*k,f+e*k))k++}}}
 return m}
function apply(s,m){const b=s.b.slice(),p=b[m.from],c=p[0],cast={...s.cast};b[m.to]=m.promo?c+m.promo:p;b[m.from]=null;
 if(m.ep)b[m.to+(c=='w'?8:-8)]=null;
 if(m.cs){const h=(m.to>>3)*8;if(m.cs=='K'){b[h+5]=b[h+7];b[h+7]=null}else{b[h+3]=b[h];b[h]=null}}
 if(p[1]=='K')cast[c+'K']=cast[c+'Q']=false;
 for(const q of[m.from,m.to]){if(q==0)cast.bQ=false;if(q==7)cast.bK=false;if(q==56)cast.wQ=false;if(q==63)cast.wK=false}
 return{b,turn:c=='w'?'b':'w',cast,ep:m.dbl?(m.from+m.to)/2:-1}}
function legal(s){const c=s.turn;return pseudo(s,c).filter(m=>{const n=apply(s,m);return!att(n,n.b.indexOf(c+'K'),c)})}
function status(s){const ck=att(s,s.b.indexOf(s.turn+'K'),s.turn);if(!legal(s).length)return ck?'mate':'stale';return ck?'check':'ok'}
function san(s,m,ns){const t=s.b[m.from][1],su=status(ns),x=su=='mate'?'#':su=='check'?'+':'';if(m.cs)return(m.cs=='K'?'O-O':'O-O-O')+x;
 const cap=s.b[m.to]||m.ep,sq='abcdefgh'[m.to&7]+(8-(m.to>>3));return(t=='P'?(cap?'abcdefgh'[m.from&7]+'x':''):t+(cap?'x':''))+sq+(m.promo?'='+m.promo:'')+x}
function ev(s){let t=0;for(let i=0;i<64;i++){const p=s.b[i];if(!p)continue;const r=i>>3,f=i&7;let v=V[p[1]];if('PNB'.includes(p[1]))v+=(7-Math.abs(2*r-7)+7-Math.abs(2*f-7))*2;if(p[1]=='P')v+=(p[0]=='w'?6-r:r-1)*6;t+=p[0]=='w'?v:-v}return s.turn=='w'?t:-t}
function nega(s,d,a,b){const ms=legal(s);if(!ms.length)return att(s,s.b.indexOf(s.turn+'K'),s.turn)?-99999-d:0;if(!d)return ev(s);
 ms.sort((x,y)=>(s.b[y.to]?V[s.b[y.to][1]]:0)-(s.b[x.to]?V[s.b[x.to][1]]:0));
 for(const m of ms){const v=-nega(apply(s,m),d-1,-b,-a);if(v>=b)return b;if(v>a)a=v}return a}
function ai(s,lv){const ms=legal(s);if(!lv)return ms[Math.random()*ms.length|0];let best=-1e9,bm=ms[0];for(const m of ms){const v=-nega(apply(s,m),lv,-1e9,1e9)+Math.random()*5;if(v>best){best=v;bm=m}}return bm}

const SY={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
function Board(host,o){const B={s:o.s,sel:-1,last:[],hint:[],flip:false,lock:false};
 B.draw=()=>{const lm=B.sel>=0?legal(B.s).filter(m=>m.from==B.sel):[],ck=status(B.s)!='ok'&&status(B.s)!='stale'?B.s.b.indexOf(B.s.turn+'K'):-1;let h='';
  for(let k=0;k<64;k++){const i=B.flip?63-k:k,r=i>>3,f=i&7,p=B.s.b[i],t=lm.some(m=>m.to==i);
   h+=`<div class="sq ${(r+f)%2?'d':'l'}${i==B.sel?' sel':''}${B.last.includes(i)?' lm':''}${B.hint.includes(i)?' ht':''}${i==ck?' ck':''}" data-i="${i}">${k%8==0?`<b class="rk">${8-r}</b>`:''}${k>>3==7?`<b class="fl">${'abcdefgh'[f]}</b>`:''}${p?`<span class="pc ${p[0]}">${SY[p[1]]}&#xFE0E;</span>`:''}${t?`<i class="mv${p?' cp':''}"></i>`:''}${B.last.includes(i)?`<i class="ld ${p?'cr':'ct'} ${B.lc||(B.s.b[B.last[1]]?B.s.b[B.last[1]][0]:'w')}"></i>`:''}</div>`}
  host.innerHTML=h};
 host.onclick=e=>{if(B.lock)return;const q=e.target.closest('.sq');if(!q)return;const i=+q.dataset.i;
  const lm=B.sel>=0?legal(B.s).filter(m=>m.from==B.sel&&m.to==i):[];
  if(lm.length){const m=lm.find(x=>x.promo=='Q')||lm[0];B.sel=-1;o.onMove(m);return}
  const p=B.s.b[i];if(p&&o.free)B.s={...B.s,turn:p[0]};
  B.sel=p&&o.pick(p)?i:-1;B.hint=[];B.draw()};
 return B}

// Play
const P={s:fen(START),hist:[],moves:[],mobj:[],me:'w',lv:1,tok:0};
const pb=Board($('pb'),{s:P.s,pick:p=>p[0]==P.s.turn&&(P.lv<0||p[0]==P.me),onMove:m=>pmove(m)});
function pmove(m){const ns=apply(P.s,m),cp=P.s.b[m.to]||m.ep,s0=status(ns);sfx(s0=='mate'?(P.lv<0||P.s.turn==P.me?'win':'lose'):s0=='check'?'check':cp?'cap':'move');P.moves.push(san(P.s,m,ns));P.mobj.push(m);P.hist.push(P.s);P.s=pb.s=ns;pb.last=[m.from,m.to];pb.hint=[];pb.sel=-1;after()}
function after(){const su=status(P.s),w=P.s.turn=='w'?'White':'Black',ai_=P.lv>=0&&P.s.turn!=P.me;let t;
 if(su=='mate')t='Checkmate. '+(P.s.turn=='w'?'Black':'White')+' wins.';else if(su=='stale')t='Stalemate. The game is a draw.';
 else t=(P.lv<0?w+' to move':ai_?'Opponent is thinking…':'Your move')+(su=='check'?'. Check!':'');
 $('st').innerHTML=t.replace('…','<span class="td"><i></i><i></i><i></i></span>');$('rv').classList.toggle('p',su=='mate'||su=='stale');caps();if(su=='mate'&&(P.lv<0||P.s.turn!=P.me))confetti();let h='';for(let i=0;i<P.moves.length;i+=2)h+=`<span>${i/2+1}.</span><span>${P.moves[i]}</span><span>${P.moves[i+1]||''}</span>`;$('mv').innerHTML=h;$('mv').scrollTop=1e5;$('mv').scrollLeft=1e5;
 pb.draw();if(ai_&&(su=='ok'||su=='check')){pb.lock=true;const k=++P.tok;setTimeout(()=>{if(k!=P.tok)return;const m=ai(P.s,P.lv);pb.lock=false;pmove(m)},1200+Math.random()*900)}}
function newGame(){P.tok++;P.s=pb.s=fen(START);P.hist=[];P.moves=[];P.mobj=[];P.lv=+$('lv').value;P.me=$('me').value;pb.flip=P.lv>=0&&P.me=='b';pb.last=[];pb.hint=[];pb.sel=-1;pb.lock=false;after()}
$('ng').onclick=newGame;$('lv').onchange=$('me').onchange=newGame;
$('un').onclick=()=>{P.tok++;do{if(!P.hist.length)break;P.s=P.hist.pop();P.moves.pop();P.mobj.pop()}while(P.lv>=0&&P.s.turn!=P.me&&P.hist.length);pb.s=P.s;pb.last=[];pb.hint=[];pb.sel=-1;pb.lock=false;after()};
$('hi').onclick=()=>{if(pb.lock||!legal(P.s).length)return;const m=ai(P.s,2);pb.hint=[m.from,m.to];pb.draw()};
$('fl').onclick=()=>{pb.flip=!pb.flip;pb.draw()};

// Learn
const L=[
{t:'Meet the pieces',f:START,free:1,x:'Chess is played on 64 squares by two armies. Tap any piece to see where it can go: dots are quiet moves and rings are captures. The king can step one square in any direction and must never be left in danger. The queen is the strongest piece, the rook moves in straight lines, the bishop on diagonals, the knight jumps in an L shape, and pawns march forward.'},
{t:'Pawns and promotion',f:'8/P6k/8/8/8/8/8/K7 w - -',g:m=>m.promo,ok:'Promoted! A pawn that reaches the far rank becomes a queen, rook, bishop or knight. Pawns also capture diagonally, move two squares on their first move, and can capture "en passant" a pawn that just jumped past them.',x:'Pawns move forward one square but capture diagonally. When one reaches the far side of the board it promotes into a stronger piece, usually a queen. Your challenge: push the pawn on a7 to the last rank.'},
{t:'Castling',f:'4k3/8/8/8/8/8/PPPPPPPP/R3K2R w KQ -',g:m=>m.cs,ok:'Castled! The king moved two squares toward the rook and the rook jumped over it. It tucks your king away and wakes up a rook in one move.',x:'Castling is the only move where two pieces move at once. It is allowed if neither piece has moved, the squares between them are empty, and the king is not in check or crossing an attacked square. Your challenge: castle on either side by moving the king two squares.'},
{t:'Check and checkmate',f:'6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - -',g:(m,ns)=>status(ns)=='mate',ok:'Checkmate! The king is attacked and has no escape. This pattern is called a back-rank mate because the black pawns block their own king.',x:'A king under attack is in check and must escape on the next move. If it cannot, that is checkmate and the game is over. Your challenge: find the move that checkmates Black in one.'},
{t:'Mate with the queen',f:'7k/5Q2/6K1/8/8/8/8/8 w - -',g:(m,ns)=>status(ns)=='mate',ok:'Checkmate! The queen attacks the king while your own king guards the queen, so it cannot be captured. Careful: some queen moves here cause stalemate, which is a draw.',x:'The queen and king can work together to trap a lone king. Your challenge: checkmate Black in one move. Watch out, the black king must still have a check to answer, otherwise the game is a stalemate.'},
{t:'Opening ideas',f:START,g:(m,ns,o)=>o.b[m.from]=='wP'&&(m.to==36||m.to==35),ok:'A strong start. A pawn in the center claims space and frees your bishop and queen. Next, bring out your knights and bishops, castle early, and avoid moving the same piece twice without a reason.',x:'Good openings follow three ideas: control the center, develop your knights and bishops, and get your king to safety by castling. Your challenge: open with a center pawn by playing e2 to e4 or d2 to d4.'}];
let li=0;const done=new Set();
const lb=Board($('lb'),{s:fen(START),get free(){return L[li].free},pick:p=>L[li].free||p[0]=='w',onMove:m=>{const q=L[li];if(q.free){lb.draw();return}
 const old=lb.s,ns=apply(old,m);lb.s=ns;lb.last=[m.from,m.to];lb.lock=true;lb.draw();
 if(q.g(m,ns,old)){done.add(li);$('lg').textContent=q.ok;say(q.ok);sfx('win');confetti();chips()}else{$('lg').textContent='Not quite. Try again.';setTimeout(()=>lesson(li),1100)}}});
function chips(){$('chips').innerHTML=L.map((q,i)=>`<button class="chip${i==li?' on':''}" data-i="${i}">${done.has(i)?'✓ ':''}${q.t}</button>`).join('');$('nx').hidden=li>=L.length-1}
function lesson(n){if(SS)SS.cancel();li=n;const q=L[n];$('lt').textContent=q.t;$('lx').textContent=q.x||L[0].x;$('lg').textContent=q.free?'Tap a piece to see its moves.':'Your turn as White.';
 lb.s=fen(q.f);lb.last=[];lb.sel=-1;lb.lock=false;lb.draw();chips()}
$('chips').onclick=e=>{const c=e.target.closest('.chip');if(c)lesson(+c.dataset.i)};
$('rs').onclick=()=>lesson(li);$('ls').onclick=()=>say(L[li].t+'. '+(L[li].x||L[0].x));$('nx').onclick=()=>lesson(li+1);
const SS=window.speechSynthesis,NM={P:'pawn',N:'knight',B:'bishop',R:'rook',Q:'queen',K:'king'},sqn=i=>'abcdefgh'[i&7]+(8-(i>>3)),dsc=(s,m)=>NM[s.b[m.from][1]]+' from '+sqn(m.from)+' to '+sqn(m.to);
function say(t){if(!SS)return;SS.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=S.rate;u.pitch=S.pt;const vs=SS.getVoices(),v=vs.find(v=>v.name==S.vn)||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;SS.speak(u)}
function show(t){if(SS)SS.cancel();for(const b of document.querySelectorAll('nav button'))b.classList.toggle('on',b.dataset.t==t);for(const id of['play','learn','review'])$(id).hidden=id!=t}
const R={items:[],cur:-1,key:'',alt:false,tok:0},rb=Board($('rb'),{s:fen(START),pick:()=>false,onMove(){}});rb.lock=true;
function grade(l){return l<=10?['Best move','g']:l<40?['Good','g']:l<120?['Inaccuracy','i']:l<300?['Mistake','m']:['Blunder','b']}
function why(s,m){const ns=apply(s,m);let g=0,gm;for(const x of legal(ns)){const tg=ns.b[x.to];if(!tg)continue;const gain=V[tg[1]]-(att(apply(ns,x),x.to,ns.turn)?V[ns.b[x.from][1]]:0);if(gain>g){g=gain;gm=x}}
 return g>=200?`the opponent's ${NM[ns.b[gm.from][1]]} can take your ${NM[ns.b[gm.to][1]]} on ${sqn(gm.to)}`:''}
function goal(s,b,n){const su=status(apply(s,b));if(su=='mate')return 'it checkmates the king';if(s.b[b.to])return `it wins the ${NM[s.b[b.to][1]]} on ${sqn(b.to)}`;if(b.cs)return 'castling tucks your king away safely';if(b.promo)return 'it promotes your pawn';if(su=='check')return 'it attacks the king with check';
 return n<=10&&'NBP'.includes(s.b[b.from][1])?'it develops your pieces and fights for the center':'it keeps your pieces safer and more active'}
function note(s,m,b,c,same,n){let t=`Move ${n}. You played the ${dsc(s,m)}. `;
 if(c=='Best move')return t+(same?'That is exactly the move I would play. Well done.':'That is just as good as my favorite move.');
 t+={Good:'A decent move, but there was a slightly better one. ',Inaccuracy:'That is an inaccuracy. ',Mistake:'That is a mistake. ',Blunder:'That is a blunder. '}[c];
 const w=why(s,m);if(w&&c!='Good')t+=`The problem is that ${w}. `;
 return t+`You should have played the ${dsc(s,b)}, because ${goal(s,b,n)}.`}
function startReview(){const key=P.moves.join()+P.lv+P.me;if(key==R.key)return;R.key=key;R.items=[];R.cur=-1;const tk=++R.tok;$('rl').innerHTML='';$('rc').textContent='';$('ral').hidden=true;rb.s=fen(START);rb.last=[];rb.hint=[];rb.flip=P.lv>=0&&P.me=='b';rb.draw();
 const idx=P.mobj.map((m,i)=>i).filter(i=>P.lv<0||P.hist[i].turn==P.me);
 if(!idx.length){$('rp').textContent='Play a few moves first, then come back and I will review them with you.';R.key='';return}
 (function go(k){if(tk!=R.tok)return;if(k>=idx.length){fin();return}$('rp').textContent=`Teacher is studying your game… ${k+1} of ${idx.length}`;
  setTimeout(()=>{if(tk!=R.tok)return;const i=idx[k],s=P.hist[i],m=P.mobj[i];let best=-1e9,bm,pl=-1e9;
   for(const x of legal(s)){const v=-nega(apply(s,x),2,-1e9,1e9);if(v>best){best=v;bm=x}if(x.from==m.from&&x.to==m.to&&x.promo==m.promo)pl=v}
   const same=bm.from==m.from&&bm.to==m.to&&bm.promo==m.promo,l=Math.max(0,best-pl),[c,k2]=grade(l),n=(i>>1)+1;
   R.items.push({i,m,b:bm,same,l,c,k:k2,n,san:P.moves[i],bl:s.turn=='b',text:note(s,m,bm,c,same,n)});go(k+1)},20)})(0)}
function fin(){const it=R.items,cnt=k=>it.filter(x=>x.k==k).length,w=it.reduce((a,x)=>x.l>a.l?x:a,it[0]);
 $('rl').innerHTML=it.map((x,k)=>`<div class="ri" id="ri${k}"><span class="n">${x.n}${x.bl?'...':'.'} ${x.san}</span><span class="cl ${x.k}">${x.c}</span><button class="btn" data-k="${k}">See</button></div>`).join('');
 $('rp').textContent=`You made ${it.length} moves: ${cnt('g')} good or best, ${cnt('i')} inaccuracies, ${cnt('m')} mistakes and ${cnt('b')} blunders. `+(w.l>=120?`The biggest turning point was move ${w.n}. `:'A very clean game. ')+'Tap See on any move. Dots show what you played and the green square shows my move.'}
function see(k){const x=R.items[k];if(!x)return;R.cur=k;R.alt=false;const s=P.hist[x.i];rb.s=s;rb.lc=s.turn;rb.last=[x.m.from,x.m.to];rb.hint=x.same?[]:[x.b.from,x.b.to];rb.sel=-1;rb.draw();$('rc').textContent=x.text;$('ral').hidden=x.same;$('ral').textContent="Show teacher's move";
 for(const e of document.querySelectorAll('.ri'))e.classList.toggle('on',e.id=='ri'+k);$('rt').scrollIntoView({behavior:'smooth',block:'start'});if($('tv').checked)say(x.text)}
$('rl').onclick=e=>{const b=e.target.closest('button');if(b)see(+b.dataset.k)};
$('rnx').onclick=()=>see(Math.min(R.cur+1,R.items.length-1));$('rpv').onclick=()=>see(Math.max(R.cur-1,0));
$('rls').onclick=()=>say(R.cur>=0?R.items[R.cur].text:$('rp').textContent);
$('ral').onclick=()=>{const x=R.items[R.cur];if(!x)return;R.alt=!R.alt;const s=P.hist[x.i];if(R.alt){rb.s=apply(s,x.b);rb.last=[x.b.from,x.b.to];rb.hint=[]}else{rb.s=s;rb.last=[x.m.from,x.m.to];rb.hint=[x.b.from,x.b.to]}rb.draw();$('ral').textContent=R.alt?'Back to the position':"Show teacher's move"};
$('rv').onclick=()=>{show('review');startReview()};
if(!SS){$('ls').hidden=1;$('rls').hidden=1}
document.querySelector('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;show(t);if(t=='review')startReview()};
const BT={classic:['#dfe7ee','#7d96ad','Slate'],forest:['#e6ecce','#6b8f5a','Forest'],sunset:['#f6dcc0','#c9825b','Sunset'],midnight:['#a9b8dc','#3f4f86','Midnight'],rose:['#f6e2e8','#c07890','Rose']};
let S={bt:'classic',sn:1,cf:1,co:1,ap:'auto',vn:'',rate:.95,pt:1},AC;try{Object.assign(S,JSON.parse(localStorage.getItem('tempo')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('tempo',JSON.stringify(S))}catch(e){}}
function tone(f,d,t=0,ty='sine',v=.12){const a=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;a.type=ty;a.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);a.connect(g);g.connect(AC.destination);a.start(n);a.stop(n+d)}
function sfx(k){if(!S.sn)return;if(navigator.vibrate)navigator.vibrate(k=='move'?8:25);try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
 if(k=='move')tone(520,.07,0,'triangle');else if(k=='cap'){tone(220,.12,0,'square',.08);tone(160,.14,.04,'triangle')}else if(k=='check'){tone(660,.1);tone(880,.16,.1)}
 else if(k=='win')[523,659,784,1047].forEach((f,i)=>tone(f,.25,i*.12,'triangle'));else if(k=='lose')[392,330,262].forEach((f,i)=>tone(f,.3,i*.18,'triangle'))}catch(e){}}
function confetti(){if(!S.cf)return;const cs=['#e9a400','#7a4fd6','#2f9e6e','#d03b3b','#3b82f6'];for(let i=0;i<70;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:${cs[i%5]};animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*.6}s;border-radius:${i%3?'2px':'50%'}`;document.body.appendChild(e);setTimeout(()=>e.remove(),5500)}}
function applyS(){const r=document.documentElement;r.dataset.bt=S.bt;if(S.ap=='auto')delete r.dataset.theme;else r.dataset.theme=S.ap;document.body.classList.toggle('nc',!S.co);

 $('sap').value=S.ap;$('ssn').checked=!!S.sn;$('scf').checked=!!S.cf;$('sco').checked=!!S.co;$('srt').value=S.rate;$('spt').value=S.pt}
$('sw').onclick=e=>{const b=e.target.closest('.swb');if(b){S.bt=b.dataset.k;save();applyS();sfx('move')}};

$('ssn').onchange=()=>{S.sn=$('ssn').checked?1:0;save()};$('scf').onchange=()=>{S.cf=$('scf').checked?1:0;save()};$('sco').onchange=()=>{S.co=$('sco').checked?1:0;save();applyS()};
$('srt').oninput=()=>{S.rate=+$('srt').value;save()};$('spt').oninput=()=>{S.pt=+$('spt').value;save()};$('svo').onchange=()=>{S.vn=$('svo').value;save()};

function caps(){const n={w:{},b:{}};for(const p of fen(START).b)if(p)n[p[0]][p[1]]=(n[p[0]][p[1]]||0)+1;for(const p of P.s.b)if(p)n[p[0]][p[1]]--;
 let a=0,t={w:'',b:''};for(const c of'wb')for(const k of'QRBNP'){const q=n[c][k];t[c=='w'?'b':'w']+=(SY[k]+'\uFE0E').repeat(q);a+=(c=='b'?1:-1)*q*V[k]}
 $('cap').innerHTML=`<span>White took <b>${t.w||'-'}</b></span><span>Black took <b>${t.b||'-'}</b></span><span>${a?(a>0?'White':'Black')+' +'+Math.abs(a)/100:'Even material'}</span>`}
